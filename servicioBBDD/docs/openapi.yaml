openapi: 3.0.3
info:
  title: Base de datos de un Servicio Meteorológico
  description: API para ingesta y consulta de datos meteorológicos
  version: 1.0.0
  contact:
    name: Rubén Buján Vide
    email: bujanvideruben@gmail.com

servers:
  - url: http://localhost:8080
    description: Servidor de desarrollo

paths:
  /ingest/csv:
    post:
      summary: Ingesta de datos meteorológicos desde archivo CSV
      description: |
        Permite cargar un archivo CSV con datos meteorológicos a la base de datos.
        Calcula el checksum SHA-256 del archivo y retorna estadísticas del proceso.
      tags:
        - Ingesta
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: |
                    Archivo CSV con datos meteorológicos. Formato esperado:
                    - Separador: punto y coma (;)
                    - Campos: Fecha;Ciudad;Temperatura Máxima (C);Temperatura Mínima (C);Precipitación (mm);Nubosidad (%)
                    - Formato fecha: YYYY/MM/DD
                    - Decimales: coma como separador
                    - Ejemplo: 2025/10/12;Madrid;11,55;6,25;0;10      
      responses:
        '200':
          description: CSV procesado exitosamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows_inserted:
                    type: integer
                    example: 120
                    description: Número de filas insertadas en la base de datos
                  rows_rejected:
                    type: integer
                    example: 3
                    description: Número de filas rechazadas por errores de formato
                  elapsed_ms:
                    type: integer
                    example: 450
                    description: Tiempo de procesamiento en milisegundos
                  file_checksum:
                    type: string
                    example: "sha256:a1b2c3d4e5f6..."
                    description: Checksum SHA-256 del archivo procesado
        '400':
          description: Error en la solicitud (archivo inválido o faltante)
        '405':
          description: Método no permitido
        '500':
          description: Error interno del servidor

  /cities:
    get:
      summary: Obtener lista de ciudades con información almacenada
      description: Devuelve la lista de ciudades únicas presentes en la base de datos
      tags:
        - Consulta
      responses:
        '200':
          description: Lista de ciudades obtenida exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
                example: ["Madrid", "Sevilla", "Gijón", "Valencia"]
        '500':
          description: Error interno del servidor

  /raw:
    get:
      summary: Obtener datos meteorológicos paginados
      description: |
        Retorna datos meteorológicos filtrados por ciudad y rango de fechas,
        con soporte para paginación.
      tags:
        - Consulta
      parameters:
        - name: city
          in: query
          required: true
          schema:
            type: string
          description: Nombre de la ciudad a filtrar
          example: "Madrid"
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Fecha de inicio (formato YYYY-MM-DD)
          example: "2025-10-01"
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date
          description: Fecha de fin (formato YYYY-MM-DD)
          example: "2025-10-31"
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Número de página (por defecto 1)
          example: 1
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            default: 10
          description: Número de registros por página (por defecto 10)
          example: 10
      responses:
        '200':
          description: Datos obtenidos exitosamente
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeatherData'
        '400':
          description: Parámetros obligatorios faltantes o inválidos
        '500':
          description: Error interno del servidor

components:
  schemas:
    WeatherData:
      type: object
      description: Registro de datos meteorológicos
      properties:
        fecha:
          type: string
          format: date
          description: Fecha de la medición
          example: "2025-10-12"
        ciudad:
          type: string
          description: Ciudad de la medición
          example: "Madrid"
        temp_max:
          type: number
          format: double
          description: Temperatura máxima en grados Celsius
          example: 11.55
        temp_min:
          type: number
          format: double
          description: Temperatura mínima en grados Celsius
          example: 6.25
        precipitacion:
          type: number
          format: double
          description: Precipitación en milímetros
          example: 0
        nubosidad:
          type: number
          format: double
          description: Nubosidad en porcentaje
          example: 10
      required:
        - fecha
        - ciudad
        - temp_max
        - temp_min
        - precipitacion
        - nubosidad

  responses:
    InternalServerError:
      description: Error interno del servidor
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Error conectando a la base de datos"

    BadRequest:
      description: Solicitud incorrecta
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                example: "Parámetros 'city', 'from' y 'to' son obligatorios"

tags:
  - name: Ingesta
    description: Operaciones de ingesta de datos
  - name: Consulta
    description: Operaciones de consulta de datos